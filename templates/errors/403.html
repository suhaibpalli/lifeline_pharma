<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Refresh your sign-in page - Lifeline Healthcare</title>
    <style>
        body { margin: 0; background: #f8fafc; color: #172033; font: 17px/1.6 system-ui, sans-serif; }
        main { max-width: 32rem; margin: 12vh auto; padding: 2rem; }
        a { color: #1d4ed8; }
        .button { display: inline-block; padding: .75rem 1.2rem; border-radius: .5rem; background: #1d4ed8; color: white; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>Your sign-in page has expired</h1>
        <p>We could not verify this request. Open a fresh sign-in page and try again.</p>
        <p>Your information has not been submitted.</p>
        <p><a class="button" href="{{ retry_url }}">Open sign-in page</a></p>
        <p><a href="/">Return to Lifeline Healthcare</a></p>
    </main>
</body>
</html>
