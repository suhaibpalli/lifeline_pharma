proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:50m
    max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name media.lifelinehealthcare.in;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name media.lifelinehealthcare.in;
    ssl_certificate /etc/letsencrypt/live/media.lifelinehealthcare.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.lifelinehealthcare.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    access_log /var/log/nginx/pharma-media-access.log pharma;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = / { return 404; }
    location /minio/ { return 404; }

    # Expiring signed URLs must be verified by MinIO on every request. Never
    # serve patient/profile files from a shared or stale public cache.
    location ~ ^/lifeline-media/(profiles|prescriptions)/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_read_timeout 30s;
    }
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_cache media_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 206 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
    }
}
