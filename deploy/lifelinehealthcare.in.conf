limit_req_zone $binary_remote_addr zone=pharma_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pharma_auth:10m rate=10r/m;

server {
    listen 80;
    server_name lifelinehealthcare.in www.lifelinehealthcare.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lifelinehealthcare.in www.lifelinehealthcare.in;
    ssl_certificate /etc/letsencrypt/live/lifelinehealthcare.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifelinehealthcare.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 20m;
    access_log /var/log/nginx/pharma-access.log pharma;
    error_log /var/log/nginx/pharma-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~* (\.env|\.git|phpinfo\.php|config\.php|wp-admin|wp-login) {
        deny all;
        access_log off;
    }
    location /static/ {
        alias /opt/pharma/staticfiles/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    location = /health/ {
        include /etc/nginx/pharma-proxy.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        access_log off;
    }
    location ~ ^/accounts/(login|patient/register|pharmacy/register|password-reset)/ {
        limit_req zone=pharma_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/pharma-proxy.conf;
        proxy_read_timeout 65s;
    }
    location / {
        limit_req zone=pharma_requests burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/pharma-proxy.conf;
        proxy_read_timeout 65s;
    }
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /home/suhaib/pharma/staticfiles;
    }
}
